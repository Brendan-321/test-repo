<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 14px system-ui, sans-serif; width: 260px; margin: 0; padding: 14px 16px; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    p { margin: 0 0 12px; color: #666; font-size: 12px; }
    label { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; cursor: pointer; }
    small { display: block; color: #777; font-size: 11px; }
  </style>
</head>
<body>
  <h1>Instagram Focus</h1>
  <p>Only your home feed stays.</p>
  <label><input type="checkbox" id="blockSearch" />
    <span>Block Search &amp; Explore</span></label>
  <label><input type="checkbox" id="blockReels" />
    <span>Block Reels tab</span></label>
  <label><input type="checkbox" id="blockSingleReels" />
    <span>Also block individual reels
      <small>Includes reels friends send you in DMs and reels opened from your feed.</small></span></label>
  <script src="popup.js"></script>
</body>
</html>

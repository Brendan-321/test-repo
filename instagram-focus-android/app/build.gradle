plugins {
    id "com.android.application"
}

android {
    namespace "com.instagramfocus"
    compileSdk 35

    defaultConfig {
        applicationId "com.instagramfocus"
        minSdk 27
        targetSdk 35
        versionCode 4
        versionName "1.3"
    }

    // Release signing key lives outside the repo (see README: "Signing key").
    def keyProps = new Properties()
    def keyPropsFile = rootProject.file("keystore.properties")
    if (keyPropsFile.exists()) keyPropsFile.withInputStream { keyProps.load(it) }

    signingConfigs {
        release {
            if (keyPropsFile.exists()) {
                storeFile file(keyProps["storeFile"])
                storePassword keyProps["storePassword"]
                keyAlias keyProps["keyAlias"]
                keyPassword keyProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            // Not debuggable, code shrunk and obfuscated.
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            signingConfig keyPropsFile.exists() ? signingConfigs.release : null
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            // Robolectric downloads Android system images at test time; use the same mirror as settings.gradle.
            systemProperty "robolectric.dependency.repo.url", "https://maven-central.storage-download.googleapis.com/maven2"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
}
